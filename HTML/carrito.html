<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Altioria Airlines</title>
    <link rel="icon" href="../IMG/logo empresa de software.svg">
    <link rel="stylesheet" href="../CSS/carrito.css">
</head>

<body>

    <!-- ================= BARRA DE NAVEGACION ================= -->

    <header class="header" id="header">

        <div class="logo">
            <img src="../IMG/logo empresa de software.svg" alt="Altioria Airlines">
        </div>

        <nav class="navbar">

            <a href="../index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="historia.html">Historia</a>
            <a href="servicios.html">Servicios</a>
            <a href="destinos.html">Destinos</a>
            <a href="contacto.html">Contacto</a>

            <a href="carrito.html" class="carrito-icono">
                🛒
                <span id="contador-carrito">0</span>
            </a>

        </nav>

    </header>


    <!-- ================= CARRITO ================= -->

    <main class="carrito-container">

        <h1>Tu carrito</h1>

        <p class="subtitulo">
            Revisa los vuelos que has seleccionado antes de continuar.
        </p>

        <section id="carrito">

            <!-- Los vuelos apareceran aqui -->

        </section>


        <!-- ================= RESUMEN ================= -->

        <section class="resumen">

            <h2>Resumen de la reserva</h2>

            <div class="linea">

                <span>Subtotal</span>

                <span id="subtotal">$0</span>

            </div>

            <div class="linea">

                <span>Impuestos</span>

                <span id="impuestos">$0</span>

            </div>

            <hr>

            <div class="total">

                <span>Total</span>

                <span id="total">$0</span>

            </div>

            <button id="continuar">
                Continuar con la reserva
            </button>

        </section>

    </main>


    <script src="../JS/carrito.js"></script>

</body>

</html>
