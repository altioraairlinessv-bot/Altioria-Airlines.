<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Altioria Airlines</title>
    <link rel="icon" href="../IMG/logo empresa de software.svg">
    <link rel="stylesheet" href="../CSS/registro.css">
</head>

<body>

    <!-- ================= BOTON REGRESAR ================= -->

    <a href="login.html" class="btn-regresar">
        ← Regresar
    </a>


    <!-- ================= FONDO ================= -->

    <div class="fondo">

        <img
            src="../IMG/imagen-sesion.jpeg"
            alt="Fondo de Altioria Airlines"
        >

    </div>


    <!-- ================= REGISTRO ================= -->

    <div class="registro-container">

        <div class="registro-box">

            <h1>
                Crear cuenta
            </h1>

            <p>
                Registrate en Altioria Airlines
            </p>

            <form id="form-registro">

                <div class="campo">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingresa tu nombre"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="correo">
                        Correo electronico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="Ingresa tu correo"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Crea una contraseña"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="confirmar">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar"
                        placeholder="Repite tu contraseña"
                        required
                    >

                </div>

                <button type="submit">
                    Crear cuenta
                </button>

            </form>

            <p class="login">
                ¿Ya tienes una cuenta?
                <a href="login.html">
                    Inicia sesion
                </a>
            </p>

        </div>

    </div>


    <script src="../JS/registro.js"></script>

</body>

</html>
